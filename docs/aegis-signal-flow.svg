<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
  <title>AEGIS Signal Flow — Client to IRG to LLM</title>
  <desc>Diagram showing how a human client's signal passes through the AEGIS Align Plexus and IRG before reaching an LLM, and returns through the same low-pressure environment.</desc>

  <defs>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="25%"  stop-color="#ffd93d" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#6bcb77" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#4d96ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="crystalBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d1f36"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4d96ff" opacity="0.9"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8c96a" opacity="0.9"/>
    </marker>
    <marker id="arrowBlueRev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4d96ff" opacity="0.9"/>
    </marker>
    <marker id="arrowGoldRev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#e8c96a" opacity="0.9"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#080e1a" rx="16"/>

  <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
  </g>

  <rect x="180" y="60" width="440" height="400" rx="20"
    fill="#0a1628" stroke="#1e3a5c" stroke-width="1" stroke-dasharray="6 4" opacity="0.8"/>
  <text x="400" y="52" text-anchor="middle" font-size="11" fill="#2a5a8a" letter-spacing="2" font-family="sans-serif">LOW PRESSURE ENVIRONMENT — AEGIS CORE</text>

  <g filter="url(#softglow)">
    <path d="M72 160 L110 172 L115 220 Q115 248 88 262 Q61 248 61 220 L66 172 Z"
      fill="url(#crystalBlue)" stroke="#4a8abf" stroke-width="1.5"/>
    <path d="M88 160 L66 172 L72 210 L88 202 Z" fill="#1e4a7a" opacity="0.4"/>
    <path d="M88 160 L110 172 L104 210 L88 202 Z" fill="#2a5a8a" opacity="0.3"/>
    <polygon points="88,175 100,198 76,198" fill="url(#prism)" opacity="0.85" filter="url(#glow)"/>
    <polygon points="88,220 100,197 76,197" fill="url(#prism)" opacity="0.45"/>
    <circle cx="88" cy="197" r="3" fill="white" opacity="0.9" filter="url(#glow)"/>
    <text x="88" y="170" text-anchor="middle" font-size="7" fill="#e8d898" letter-spacing="1.5">AEGIS</text>
  </g>

  <rect x="20" y="270" width="136" height="64" rx="10" fill="#0d1f36" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="88" y="290" text-anchor="middle" font-size="13" fill="#a0c8f0" font-weight="bold">CLIENT</text>
  <text x="88" y="308" text-anchor="middle" font-size="9" fill="#4a7aaa" font-family="sans-serif">Human operator</text>
  <text x="88" y="322" text-anchor="middle" font-size="9" fill="#4a7aaa" font-family="sans-serif">Overlay active</text>

  <rect x="196" y="118" width="130" height="58" rx="10" fill="#0a1e32" stroke="#1e3a6a" stroke-width="1.5"/>
  <text x="261" y="141" text-anchor="middle" font-size="11" fill="#7ab0e0" font-weight="bold">DAEMON</text>
  <text x="261" y="157" text-anchor="middle" font-size="8.5" fill="#3a6a9a" font-family="sans-serif">Relationship</text>
  <text x="261" y="168" text-anchor="middle" font-size="8.5" fill="#3a6a9a" font-family="sans-serif">Recognition</text>

  <path d="M261 118 L261 88 L760 88 L760 200"
    stroke="#2a4a6a" stroke-width="1.5" stroke-dasharray="5 4" fill="none"
    marker-end="url(#arrowBlue)" opacity="0.5"/>
  <text x="510" y="82" text-anchor="middle" font-size="9" fill="#2a4a6a" font-family="sans-serif">non-LLM traffic passes through untouched</text>

  <circle cx="400" cy="260" r="88" fill="none" stroke="#1e4a8a" stroke-width="1" opacity="0.5" stroke-dasharray="4 3"/>
  <circle cx="400" cy="260" r="72" fill="#0c1a2e" stroke="#2a5aaa" stroke-width="1.5"/>

  <g stroke="#1e3a6a" stroke-width="0.6" opacity="0.6" fill="none">
    <circle cx="400" cy="260" r="48"/>
    <line x1="400" y1="212" x2="400" y2="308"/>
    <line x1="352" y1="260" x2="448" y2="260"/>
    <line x1="366" y1="226" x2="434" y2="294"/>
    <line x1="434" y1="226" x2="366" y2="294"/>
    <line x1="358" y1="240" x2="442" y2="280"/>
    <line x1="442" y1="240" x2="358" y2="280"/>
  </g>

  <polygon points="400,222 434,278 366,278" fill="url(#prism)" opacity="0.9" filter="url(#glow)"/>
  <polygon points="400,298 434,242 366,242" fill="url(#prism)" opacity="0.5"/>
  <circle cx="400" cy="260" r="7" fill="white" opacity="0.95" filter="url(#glow)"/>

  <text x="400" y="350" text-anchor="middle" font-size="13" fill="#a0c8f0" font-weight="bold">AEGIS ALIGN</text>
  <text x="400" y="368" text-anchor="middle" font-size="10" fill="#4a7aaa" font-family="sans-serif">IRG · Environment Governance</text>

  <text x="400" y="195" text-anchor="middle" font-size="8.5" fill="#6ab0d8" font-family="sans-serif">Sovereignty</text>
  <text x="480" y="264" text-anchor="start"  font-size="8.5" fill="#6ab0d8" font-family="sans-serif">Integrity</text>
  <text x="400" y="342" text-anchor="middle" font-size="8.5" fill="#6ab0d8" font-family="sans-serif">Illumination</text>
  <text x="316" y="264" text-anchor="end"    font-size="8.5" fill="#6ab0d8" font-family="sans-serif">Flow</text>

  <rect x="644" y="200" width="136" height="120" rx="12" fill="#0d1f36" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="712" y="230" text-anchor="middle" font-size="13" fill="#a0c8f0" font-weight="bold">LLM</text>
  <text x="712" y="250" text-anchor="middle" font-size="8.5" fill="#4a7aaa" font-family="sans-serif">Anthropic · OpenAI</text>
  <text x="712" y="264" text-anchor="middle" font-size="8.5" fill="#4a7aaa" font-family="sans-serif">Google · Mistral</text>
  <text x="712" y="278" text-anchor="middle" font-size="8.5" fill="#4a7aaa" font-family="sans-serif">Groq · Cohere</text>
  <text x="712" y="295" text-anchor="middle" font-size="8.5" fill="#3a5a7a" font-family="sans-serif">+ any provider</text>

  <path d="M156 282 L193 190" stroke="#4d96ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="164" y="232" font-size="8.5" fill="#4d96ff" font-family="sans-serif" transform="rotate(-60 164 232)">outbound</text>

  <path d="M326 148 Q360 200 368 220" stroke="#4d96ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="340" y="178" text-anchor="middle" font-size="8" fill="#4d96ff" font-family="sans-serif">session tagged</text>

  <path d="M472 248 L641 244" stroke="#4d96ff" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="556" y="237" text-anchor="middle" font-size="9" fill="#4d96ff" font-family="sans-serif">governed signal →</text>

  <path d="M641 276 L472 272" stroke="#e8c96a" stroke-width="2.5" fill="none" marker-end="url(#arrowGoldRev)"/>
  <text x="556" y="290" text-anchor="middle" font-size="9" fill="#e8c96a" font-family="sans-serif">← response through IRG</text>

  <path d="M366 296 Q300 340 200 320 L156 310" stroke="#e8c96a" stroke-width="2" fill="none" marker-end="url(#arrowGoldRev)"/>
  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#e8c96a" font-family="sans-serif">governed response →</text>

  <rect x="580" y="380" width="180" height="70" rx="8" fill="#0a1628" stroke="#1e3a5c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="670" y="400" text-anchor="middle" font-size="9" fill="#5a8ab8" font-family="sans-serif" font-weight="bold">DETECTION POINT</text>
  <text x="670" y="415" text-anchor="middle" font-size="8.5" fill="#3a6a8a" font-family="sans-serif">Inbound response headers</text>
  <text x="670" y="428" text-anchor="middle" font-size="8.5" fill="#3a6a8a" font-family="sans-serif">trigger session tag.</text>
  <text x="670" y="441" text-anchor="middle" font-size="8.5" fill="#3a6a8a" font-family="sans-serif">Envelope only — no content.</text>
  <line x1="644" y1="390" x2="620" y2="380" stroke="#1e3a5c" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="20" y="420" width="160" height="72" rx="8" fill="#0a1628" stroke="#1e3a5c" stroke-width="1"/>
  <text x="100" y="438" text-anchor="middle" font-size="9" fill="#5a8ab8" font-family="sans-serif" font-weight="bold">SIGNAL DIRECTION</text>
  <line x1="34" y1="452" x2="74" y2="452" stroke="#4d96ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="80" y="456" font-size="9" fill="#4d96ff" font-family="sans-serif">Client → LLM</text>
  <line x1="34" y1="470" x2="74" y2="470" stroke="#e8c96a" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="80" y="474" font-size="9" fill="#e8c96a" font-family="sans-serif">LLM → Client</text>
  <line x1="34" y1="488" x2="74" y2="488" stroke="#2a4a6a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <text x="80" y="492" font-size="9" fill="#2a4a6a" font-family="sans-serif">Bypassed traffic</text>

  <text x="400" y="30" text-anchor="middle" font-size="17" fill="#c8dff8" font-weight="bold" letter-spacing="1">AEGIS GaaS — Signal Flow</text>
  <text x="400" y="48" text-anchor="middle" font-size="10" fill="#3a6a9a" font-family="sans-serif" letter-spacing="0.5">Environment Governance · Not Content Governance</text>
</svg>
